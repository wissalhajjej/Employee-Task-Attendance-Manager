<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { font-family: Arial; padding: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    select, input, textarea { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
    textarea { min-height: 80px; }
    button { background: #4285f4; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; width: 100%; }
    .message { margin-top: 15px; padding: 10px; border-radius: 4px; display: none; }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
  </style>
</head>
<body>
  <h2>Create New Task</h2>
  <div class="form-group">
    <label>Task Name:</label>
    <input type="text" id="taskName">
  </div>
  <div class="form-group">
    <label>Assign To:</label>
    <select id="employee"><option value="">Select Employee</option></select>
  </div>
  <div class="form-group">
    <label>Priority:</label>
    <select id="priority">
      <option value="Low">Low</option>
      <option value="Medium" selected>Medium</option>
      <option value="High">High</option>
    </select>
  </div>
  <div class="form-group">
    <label>Due Date:</label>
    <input type="date" id="dueDate">
  </div>
  <div class="form-group">
    <label>Notes:</label>
    <textarea id="notes"></textarea>
  </div>
  <button onclick="submitTask()">Create Task</button>
  <div id="message" class="message"></div>
  
  <script>
    google.script.run.withSuccessHandler(function(employees) {
      const sel = document.getElementById('employee');
      employees.forEach(emp => {
        const opt = document.createElement('option');
        opt.value = emp.id;
        opt.text = emp.id + ' - ' + emp.name;
        sel.appendChild(opt);
      });
    }).getEmployeeList();
    
    const tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    document.getElementById('dueDate').valueAsDate = tomorrow;
    
    function submitTask() {
      const taskName = document.getElementById('taskName').value;
      const empId = document.getElementById('employee').value;
      const priority = document.getElementById('priority').value;
      const dueDate = document.getElementById('dueDate').value;
      const notes = document.getElementById('notes').value;
      
      if (!taskName || !empId || !dueDate) {
        showMessage('Please fill all required fields', 'error');
        return;
      }
      
      google.script.run
        .withSuccessHandler(function(msg) {
          showMessage(msg, 'success');
          setTimeout(() => google.script.host.close(), 1500);
        })
        .withFailureHandler(function(err) {
          showMessage('Error: ' + err.message, 'error');
        })
        .createTask(taskName, empId, priority, dueDate, notes);
    }
    
    function showMessage(text, type) {
      const msg = document.getElementById('message');
      msg.textContent = text;
      msg.className = 'message ' + type;
      msg.style.display = 'block';
    }
  </script>
</body>
</html>
