<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { font-family: Arial; padding: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    select, input { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
    button { background: #4285f4; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 10px; }
    .message { margin-top: 15px; padding: 10px; border-radius: 4px; display: none; }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
    #attendanceSection { display: none; }
  </style>
</head>
<body>
  <h2>Generate Reports</h2>
  <div class="form-group">
    <label>Report Type:</label>
    <select id="reportType" onchange="toggleDates()">
      <option value="task">Task Report</option>
      <option value="attendance">Attendance Report</option>
    </select>
  </div>
  <div id="attendanceSection">
    <div class="form-group">
      <label>Start Date:</label>
      <input type="date" id="startDate">
    </div>
    <div class="form-group">
      <label>End Date:</label>
      <input type="date" id="endDate">
    </div>
  </div>
  <button onclick="generateReport()">Generate</button>
  <div id="message" class="message"></div>
  
  <script>
    const today = new Date();
    const lastWeek = new Date();
    lastWeek.setDate(lastWeek.getDate() - 7);
    document.getElementById('startDate').valueAsDate = lastWeek;
    document.getElementById('endDate').valueAsDate = today;
    
    function toggleDates() {
      const type = document.getElementById('reportType').value;
      document.getElementById('attendanceSection').style.display = 
        type === 'attendance' ? 'block' : 'none';
    }
    
    function generateReport() {
      const type = document.getElementById('reportType').value;
      
      if (type === 'task') {
        google.script.run
          .withSuccessHandler(function(msg) {
            showMessage(msg, 'success');
            setTimeout(() => google.script.host.close(), 2000);
          })
          .withFailureHandler(function(err) {
            showMessage('Error: ' + err.message, 'error');
          })
          .generateTaskReport();
      } else {
        const start = document.getElementById('startDate').value;
        const end = document.getElementById('endDate').value;
        
        if (!start || !end) {
          showMessage('Please select dates', 'error');
          return;
        }
        
        google.script.run
          .withSuccessHandler(function(msg) {
            showMessage(msg, 'success');
            setTimeout(() => google.script.host.close(), 2000);
          })
          .withFailureHandler(function(err) {
            showMessage('Error: ' + err.message, 'error');
          })
          .generateAttendanceReport(start, end);
      }
    }
    
    function showMessage(text, type) {
      const msg = document.getElementById('message');
      msg.textContent = text;
      msg.className = 'message ' + type;
      msg.style.display = 'block';
    }
  </script>
</body>
</html>
