<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { font-family: Arial; padding: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    select, input { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
    button { background: #4285f4; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; width: 100%; }
    .message { margin-top: 15px; padding: 10px; border-radius: 4px; display: none; }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
  </style>
</head>
<body>
  <h2>Mark Attendance</h2>
  <div class="form-group">
    <label>Employee:</label>
    <select id="employee"><option value="">Select Employee</option></select>
  </div>
  <div class="form-group">
    <label>Check In:</label>
    <input type="time" id="checkIn" value="09:00">
  </div>
  <div class="form-group">
    <label>Check Out:</label>
    <input type="time" id="checkOut" value="17:00">
  </div>
  <div class="form-group">
    <label>Status:</label>
    <select id="status">
      <option value="Present">Present</option>
      <option value="Late">Late</option>
      <option value="Absent">Absent</option>
    </select>
  </div>
  <button onclick="submitAttendance()">Submit</button>
  <div id="message" class="message"></div>
  
  <script>
    google.script.run.withSuccessHandler(function(employees) {
      const sel = document.getElementById('employee');
      employees.forEach(emp => {
        const opt = document.createElement('option');
        opt.value = emp.id;
        opt.text = emp.id + ' - ' + emp.name;
        sel.appendChild(opt);
      });
    }).getEmployeeList();
    
    function submitAttendance() {
      const empId = document.getElementById('employee').value;
      const checkIn = document.getElementById('checkIn').value;
      const checkOut = document.getElementById('checkOut').value;
      const status = document.getElementById('status').value;
      
      if (!empId) {
        showMessage('Please select an employee', 'error');
        return;
      }
      
      google.script.run
        .withSuccessHandler(function(msg) {
          showMessage(msg, 'success');
          setTimeout(() => google.script.host.close(), 1500);
        })
        .withFailureHandler(function(err) {
          showMessage('Error: ' + err.message, 'error');
        })
        .markAttendance(empId, checkIn, checkOut, status);
    }
    
    function showMessage(text, type) {
      const msg = document.getElementById('message');
      msg.textContent = text;
      msg.className = 'message ' + type;
      msg.style.display = 'block';
    }
  </script>
</body>
</html>
